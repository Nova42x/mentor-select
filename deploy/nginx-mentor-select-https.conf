limit_req_zone $binary_remote_addr zone=mentor_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=mentor_conn:10m;

server {
    listen 80 default_server;
    server_name example.com www.example.com _;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 8m;
    client_header_timeout 10s;
    client_body_timeout 15s;
    keepalive_timeout 20s;
    send_timeout 30s;
    reset_timedout_connection on;
    limit_conn mentor_conn 30;
    limit_conn_status 429;
    limit_req_status 429;

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location ~* ^/(?:wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|adminer|boaform|vendor/phpunit)(?:/|$) {
        return 404;
    }

    location ~* \.(?:php[0-9]?|phtml|asp|aspx|jsp|cgi|sh|sql|bak|old|swp)$ {
        return 404;
    }

    location = /login {
        limit_req zone=mentor_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
