{% extends "base.html" %}
{% block title %}管理后台 - 导师双选{% endblock %}
{% block body_class %}admin-body{% endblock %}
{% block page_class %}admin-page{% endblock %}
{% block content %}
<div class="admin-shell" id="adminShell">
  <aside class="admin-sider" aria-label="管理后台导航">
    <nav class="admin-nav">
      <div class="admin-nav-section">数据中心</div>
      <button class="admin-nav-item active" data-tab="dashboard" type="button" aria-label="数据看板" onclick="tab('dashboard', this)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6v-9h-6v9Zm0-16v5h6V4h-6Z"/></svg>
        <span class="admin-nav-text">数据看板</span>
      </button>
      <div class="admin-nav-section">互选管理</div>
      <button class="admin-nav-item" data-tab="overview" type="button" aria-label="互选控制" onclick="tab('overview', this)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7V3Zm2 0v7h7a9 9 0 0 0-7-7Z"/></svg>
        <span class="admin-nav-text">互选控制</span>
      </button>
      <button class="admin-nav-item" data-tab="mentors" type="button" aria-label="导师管理" onclick="tab('mentors', this)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8l10 5 8-4v6h2V8L12 3Zm-6 9v5c2.8 3 9.2 3 12 0v-5l-6 3-6-3Z"/></svg>
        <span class="admin-nav-text">导师管理</span>
      </button>
      <button class="admin-nav-item" data-tab="students" type="button" aria-label="学生管理" onclick="tab('students', this)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm6 1a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM2 20h14c0-4-2.7-7-7-7s-7 3-7 7Zm14-6c2.7.5 4.5 2.6 4.5 6H18c0-2.4-.7-4.4-2-6Z"/></svg>
        <span class="admin-nav-text">学生管理</span>
      </button>
      <button class="admin-nav-item" data-tab="matches" type="button" aria-label="匹配管理" onclick="tab('matches', this)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 6A3.5 3.5 0 1 0 4 9.5 3.5 3.5 0 0 0 7.5 6Zm9 12a3.5 3.5 0 1 0 3.5-3.5A3.5 3.5 0 0 0 16.5 18ZM8 8h7a3 3 0 0 1 3 3v1h-2v-1a1 1 0 0 0-1-1H8V8Zm8 8H9a3 3 0 0 1-3-3v-1h2v1a1 1 0 0 0 1 1h7v2Z"/></svg>
        <span class="admin-nav-text">匹配管理</span>
      </button>
      <div class="admin-nav-section">系统记录</div>
      <button class="admin-nav-item" data-tab="logs" type="button" aria-label="操作日志" onclick="tab('logs', this)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5V3Zm3 4v2h8V7H8Zm0 4v2h8v-2H8Zm0 4v2h6v-2H8Z"/></svg>
        <span class="admin-nav-text">操作日志</span>
      </button>
      <button class="admin-nav-item" data-tab="export" type="button" aria-label="数据导出" onclick="tab('export', this)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3h2v10l3-3 1.4 1.4L12 16.8l-5.4-5.4L8 10l3 3V3ZM4 18h16v3H4v-3Z"/></svg>
        <span class="admin-nav-text">数据导出</span>
      </button>
    </nav>
    <button class="admin-sider-collapse" type="button" onclick="toggleAdminSidebar()" aria-label="收起或展开侧边栏">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15.5 5-7 7 7 7 1.5-1.5-5.5-5.5L17 6.5 15.5 5Z"/></svg>
      <span class="admin-nav-text">收起导航</span>
    </button>
  </aside>
  <button class="admin-sider-mask" type="button" onclick="closeAdminSidebar()" aria-label="关闭导航"></button>

  <section class="admin-workspace">
    <div class="admin-page-header">
      <button class="admin-mobile-menu" type="button" onclick="toggleAdminSidebar()" aria-label="打开导航">
        <span></span><span></span><span></span>
      </button>
      <div>
        <div class="admin-breadcrumb">导师双选 <span>/</span> 管理后台</div>
        <h1 id="adminPageTitle">数据看板</h1>
        <p id="adminPageDesc">查看互选进度、访问趋势与用户访问明细</p>
      </div>
      <div class="admin-head-meta"><span class="live-dot"></span><span id="adminGeneratedAt">实时数据</span></div>
    </div>

    <div id="banner" style="display:none"></div>
    <div id="dashboard"></div>
    <div id="overview" style="display:none"></div>
    <div id="mentors" style="display:none"></div>
    <div id="students" style="display:none"></div>
    <div id="matches" style="display:none"></div>
    <div id="logs" style="display:none"></div>
    <div id="export" style="display:none"></div>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
'use strict';
const $ = UI.$;
const esc = UI.esc;
let info = { mode: 'realtime', open: true };
let activeTab = 'dashboard';

const ADMIN_PAGES = {
  dashboard: ['数据看板', '查看互选进度、访问趋势与用户访问明细'],
  overview: ['互选控制', '管理实时互选入口、登录安全与学院/专业等基础选项'],
  mentors: ['导师管理', '维护导师账号、招生专业、招生类别与名额'],
  students: ['学生管理', '查询并维护学生账号、专业与当前申请状态'],
  matches: ['匹配管理', '查看实时配对结果，并由管理员调整或解除配对'],
  logs: ['操作日志', '审计管理员的流程控制与数据修改操作'],
  export: ['数据导出', '导出当前互选结果、申请明细和基础名单']
};

/* ---------- Tab ---------- */
function tab(name, btn) {
  activeTab = name;
  document.querySelectorAll('.admin-nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  ['dashboard', 'overview', 'mentors', 'students', 'matches', 'logs', 'export'].forEach(t => $('#' + t).style.display = t === name ? '' : 'none');
  $('#banner').style.display = name === 'overview' ? '' : 'none';
  const page = ADMIN_PAGES[name] || ADMIN_PAGES.dashboard;
  $('#adminPageTitle').textContent = page[0];
  $('#adminPageDesc').textContent = page[1];
  history.replaceState(null, '', '#' + name);
  closeAdminSidebar();
  ({ dashboard: loadDashboard, overview: loadOverview, mentors: loadMentors, students: loadStudents,
     matches: loadMatches, logs: loadLogs, export: loadExport })[name]();
}

function toggleAdminSidebar() {
  const shell = $('#adminShell');
  if (window.matchMedia('(max-width: 900px)').matches) {
    shell.classList.toggle('mobile-open');
    return;
  }
  shell.classList.toggle('sider-collapsed');
  localStorage.setItem('admin-sider-collapsed', shell.classList.contains('sider-collapsed') ? '1' : '0');
}

function closeAdminSidebar() {
  $('#adminShell')?.classList.remove('mobile-open');
}

function formatCount(value) {
  return Number(value || 0).toLocaleString('zh-CN');
}

const dashboardVisitorView = {
  q: '', role: 'all', page: 1,
  pageSize: Number(localStorage.getItem('dashboard-visitor-page-size')) || 20
};
if (![10, 20, 50, 100].includes(dashboardVisitorView.pageSize)) dashboardVisitorView.pageSize = 20;

function dashboardVisitorUrl(page = dashboardVisitorView.page) {
  return '/api/admin/dashboard?' + new URLSearchParams({
    page, page_size: dashboardVisitorView.pageSize,
    q: dashboardVisitorView.q, role: dashboardVisitorView.role
  });
}

function dashboardVisitorRows(items) {
  return items.map(item => `<tr>
    <td><span class="mono">${esc(item.ip || 'unknown')}</span></td>
    <td>${item.username ? `<span class="cell-main mono">${esc(item.username)}</span>` : '<span class="empty-inline">未登录</span>'}</td>
    <td>${esc(item.display_name) || '<span class="empty-inline">—</span>'}</td>
    <td><span class="tag ${item.role === 'student' ? 'tag-blue' : item.role === 'mentor' ? 'tag-green' : item.role === 'admin' ? 'tag-purple' : 'tag-gray'}">${esc(item.role_label)}</span></td>
    <td><b>${formatCount(item.visits)}</b></td><td>${esc(item.last_visit)}</td>
  </tr>`).join('') || '<tr><td colspan="6" class="empty">暂无符合条件的访问记录</td></tr>';
}

function dashboardPageTokens(page, totalPages) {
  if (totalPages <= 7) return Array.from({ length: totalPages }, (_, index) => index + 1);
  if (page <= 4) return [1, 2, 3, 4, 5, '…', totalPages];
  if (page >= totalPages - 3) return [1, '…', totalPages - 4, totalPages - 3, totalPages - 2, totalPages - 1, totalPages];
  return [1, '…', page - 1, page, page + 1, '…', totalPages];
}

function renderTemplatePager(p, pageFunction, pageSizeFunction, selectId) {
  const start = p.total ? ((p.page - 1) * p.page_size + 1) : 0;
  const end = Math.min(p.page * p.page_size, p.total);
  const pages = dashboardPageTokens(p.page, p.total_pages).map((item, index) => item === '…'
    ? `<span class="template-pager-ellipsis" data-index="${index}">…</span>`
    : `<button class="template-page-btn ${item === p.page ? 'active' : ''}" type="button" onclick="${pageFunction}(${item})" ${item === p.page ? 'aria-current="page"' : ''}>${item}</button>`).join('');
  return `<div class="template-pager">
    <span class="template-pager-total">第 ${start}-${end} 条/总共 ${p.total} 条</span>
    <div class="template-pager-pages">
      <button class="template-page-btn template-page-arrow" type="button" aria-label="上一页" onclick="${pageFunction}(${p.page - 1})" ${p.page <= 1 ? 'disabled' : ''}>‹</button>
      ${pages}
      <button class="template-page-btn template-page-arrow" type="button" aria-label="下一页" onclick="${pageFunction}(${p.page + 1})" ${p.page >= p.total_pages ? 'disabled' : ''}>›</button>
    </div>
    <select id="${selectId}" aria-label="每页展示数" onchange="${pageSizeFunction}()">
      ${[10, 20, 50, 100].map(size => `<option value="${size}" ${size === p.page_size ? 'selected' : ''}>${size} 条/页</option>`).join('')}
    </select>
  </div>`;
}

function dashboardVisitorPager(p) {
  return renderTemplatePager(p, 'loadDashboardVisitors', 'changeDashboardVisitorPageSize', 'dashboardVisitorPageSize');
}

async function loadDashboardVisitors(page = 1) {
  const panel = document.querySelector('.dashboard-visitors-panel');
  panel?.classList.add('is-loading');
  try {
    const d = await UI.api(dashboardVisitorUrl(page));
    dashboardVisitorView.page = d.visitors_pagination.page;
    $('#dashboardVisitorBody').innerHTML = dashboardVisitorRows(d.visitors);
    $('#dashboardVisitorPager').innerHTML = dashboardVisitorPager(d.visitors_pagination);
    $('#adminGeneratedAt').textContent = `更新于 ${d.generated_at.slice(11, 16)}`;
  } finally {
    panel?.classList.remove('is-loading');
  }
}

function setDashboardVisitorRole(role) {
  dashboardVisitorView.role = role;
  document.querySelectorAll('.visitor-segmented button').forEach(button =>
    button.classList.toggle('active', button.dataset.role === role));
  loadDashboardVisitors(1);
}

function searchDashboardVisitors() {
  dashboardVisitorView.q = $('#dashboardVisitorSearch')?.value.trim() || '';
  loadDashboardVisitors(1);
}

function changeDashboardVisitorPageSize() {
  dashboardVisitorView.pageSize = Number($('#dashboardVisitorPageSize').value);
  localStorage.setItem('dashboard-visitor-page-size', String(dashboardVisitorView.pageSize));
  loadDashboardVisitors(1);
}

function dashboardMiniBars(items, key, tone = '') {
  const max = Math.max(1, ...items.map(item => Number(item[key] || 0)));
  return `<div class="dashboard-mini-bars ${tone}">${items.map(item =>
    `<i style="height:${Math.max(10, Math.round(Number(item[key] || 0) / max * 100))}%" title="${esc(item.label)}：${item[key]}"></i>`
  ).join('')}</div>`;
}

function dashboardAreaChart(items) {
  const width = 760, height = 250, left = 42, right = 18, top = 22, bottom = 38;
  const values = items.map(item => Number(item.visits || 0));
  const max = Math.max(1, ...values);
  const usableW = width - left - right, usableH = height - top - bottom;
  const points = items.map((item, index) => {
    const x = left + (items.length === 1 ? usableW / 2 : index * usableW / (items.length - 1));
    const y = top + usableH - Number(item.visits || 0) / max * usableH;
    return { x, y, item };
  });
  const line = points.map((point, index) => `${index ? 'L' : 'M'}${point.x.toFixed(1)},${point.y.toFixed(1)}`).join(' ');
  const area = `${line} L${points.at(-1).x.toFixed(1)},${height - bottom} L${points[0].x.toFixed(1)},${height - bottom} Z`;
  const grids = [0, .25, .5, .75, 1].map(rate => {
    const y = top + usableH * rate;
    const value = Math.round(max * (1 - rate));
    return `<line x1="${left}" y1="${y}" x2="${width - right}" y2="${y}"/><text x="${left - 10}" y="${y + 4}" text-anchor="end">${value}</text>`;
  }).join('');
  const labels = points.map(point => `<text x="${point.x}" y="${height - 13}" text-anchor="middle">${esc(point.item.label)}</text>`).join('');
  const dots = points.map(point => `<g class="dashboard-chart-point" role="button" tabindex="0" onclick="openDashboardDetail('visits','date','${esc(point.item.date)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openDashboardDetail('visits','date','${esc(point.item.date)}')}"><circle class="chart-hit" cx="${point.x}" cy="${point.y}" r="13"/><circle class="chart-dot" cx="${point.x}" cy="${point.y}" r="4"/><title>${esc(point.item.date)}：${point.item.visits} 次访问，点击查看明细</title></g>`).join('');
  return `<svg class="dashboard-area-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="近七天访问趋势">
    <defs><linearGradient id="visitArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1677ff" stop-opacity=".34"/><stop offset="1" stop-color="#1677ff" stop-opacity=".03"/></linearGradient></defs>
    <g class="chart-grid">${grids}</g><path class="chart-area" d="${area}"/><path class="chart-line" d="${line}"/>
    <g class="chart-dots">${dots}</g><g class="chart-labels">${labels}</g>
  </svg>`;
}

function dashboardRoleChart(roles) {
  const colors = { student: '#1677ff', mentor: '#52c41a', admin: '#722ed1' };
  const total = roles.reduce((sum, item) => sum + Number(item.visits || 0), 0);
  let cursor = 0;
  const parts = roles.map(item => {
    const start = cursor;
    cursor += total ? Number(item.visits || 0) / total * 100 : 0;
    return `${colors[item.role] || '#faad14'} ${start.toFixed(2)}% ${cursor.toFixed(2)}%`;
  });
  const gradient = parts.length ? parts.join(',') : '#f0f0f0 0 100%';
  return `<button class="role-donut" type="button" style="background:conic-gradient(${gradient})" onclick="openDashboardDetail('visits','role','authenticated')" aria-label="查看已登录账户访问明细"><div><b>${formatCount(total)}</b><span>账户访问</span></div></button>
    <div class="role-legend">${roles.map(item => `<button type="button" onclick="openDashboardDetail('visits','role','${item.role}')" title="查看${esc(item.label)}访问明细"><i style="background:${colors[item.role] || '#faad14'}"></i><span>${esc(item.label)}</span><b>${formatCount(item.visits)}</b><small>${item.accounts} 个账户</small></button>`).join('') || '<p class="empty-inline">暂无已登录访问记录</p>'}</div>`;
}

const dashboardDetailView = { type: '', filterKey: '', filterValue: '', pageSize: 20 };
let dashboardDetailRequestId = 0;

function dashboardDetailRows(d) {
  if (d.type === 'visits') return `<table class="dashboard-detail-table"><thead><tr><th>访问 IP</th><th>账号</th><th>姓名</th><th>身份</th><th>访问次数</th><th>最近访问</th></tr></thead><tbody>${d.rows.map(row => `<tr>
    <td class="mono">${esc(row.ip || 'unknown')}</td><td class="mono">${esc(row.username) || '<span class="empty-inline">未登录</span>'}</td>
    <td>${esc(row.display_name) || '<span class="empty-inline">—</span>'}</td><td><span class="tag ${row.role === 'student' ? 'tag-blue' : row.role === 'mentor' ? 'tag-green' : row.role === 'admin' ? 'tag-purple' : 'tag-gray'}">${esc(row.role_label)}</span></td>
    <td><b>${formatCount(row.visits)}</b></td><td>${esc(row.last_visit)}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">暂无访问记录</td></tr>'}</tbody></table>`;
  if (d.type === 'unselected') return `<table class="dashboard-detail-table"><thead><tr><th>学号</th><th>姓名</th><th>专业</th><th>手机号</th></tr></thead><tbody>${d.rows.map(row => `<tr><td class="mono">${esc(row.username)}</td><td><b>${esc(row.name)}</b></td><td>${esc(row.major) || '—'}</td><td>${esc(row.phone) || '—'}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">暂无未选择学生</td></tr>'}</tbody></table>`;
  const pending = d.type === 'pending';
  return `<table class="dashboard-detail-table"><thead><tr><th>学号</th><th>姓名</th><th>专业</th><th>${pending ? '申请导师' : '配对导师'}</th><th>${pending ? '申请时间' : '配对时间'}</th></tr></thead><tbody>${d.rows.map(row => `<tr>
    <td class="mono">${esc(row.username)}</td><td><b>${esc(row.name)}</b></td><td>${esc(row.major) || '—'}</td>
    <td><b>${esc(row.mentor_name)}</b><div class="cell-sub mono">${esc(row.mentor_username)}</div></td><td>${esc(row.created_at)}</td></tr>`).join('') || `<tr><td colspan="5" class="empty">暂无${pending ? '待审核' : '已录'}学生</td></tr>`}</tbody></table>`;
}

async function loadDashboardDetail(page = 1) {
  const requestId = ++dashboardDetailRequestId;
  const query = new URLSearchParams({ type: dashboardDetailView.type, page,
    page_size: dashboardDetailView.pageSize });
  if (dashboardDetailView.filterKey && dashboardDetailView.filterValue) {
    query.set(dashboardDetailView.filterKey, dashboardDetailView.filterValue);
  }
  try {
    const d = await UI.api('/api/admin/dashboard/detail?' + query);
    if (requestId !== dashboardDetailRequestId || !$('#modalMask')?.classList.contains('show')) return;
    const html = `<div class="modal-head dashboard-detail-head"><div><h3>${esc(d.title)}</h3><p>点击看板指标下钻查看的实时名单</p></div><button class="modal-close" type="button" onclick="UI.closeModal()">✕</button></div>
      <div class="modal-body dashboard-detail-body"><div class="table-wrap">${dashboardDetailRows(d)}</div></div>
      ${renderTemplatePager(d.pagination, 'loadDashboardDetail', 'changeDashboardDetailPageSize', 'dashboardDetailPageSize')}
      <div class="modal-foot"><button class="btn btn-default" type="button" onclick="UI.closeModal()">关闭</button></div>`;
    const box = $('#modalBox'); box.className = 'modal modal-lg dashboard-detail-modal'; box.innerHTML = html;
  } catch (error) {
    if (requestId === dashboardDetailRequestId) { UI.toast(error.message, 'error'); UI.closeModal(); }
  }
}

function openDashboardDetail(type, filterKey = '', filterValue = '') {
  dashboardDetailView.type = type;
  dashboardDetailView.filterKey = filterKey;
  dashboardDetailView.filterValue = filterValue;
  UI.openModal('<div class="dashboard-detail-loading"><span class="spinner"></span><span>正在加载明细…</span></div>', { size: 'lg' });
  loadDashboardDetail(1);
}

function changeDashboardDetailPageSize() {
  dashboardDetailView.pageSize = Number($('#dashboardDetailPageSize').value);
  loadDashboardDetail(1);
}

async function loadDashboard() {
  const d = await UI.api(dashboardVisitorUrl());
  dashboardVisitorView.page = d.visitors_pagination.page;
  const st = d.stats;
  $('#adminGeneratedAt').textContent = `更新于 ${d.generated_at.slice(11, 16)}`;
  const pairingPct = Math.max(0, Math.min(100, Number(st.pairing_rate || 0)));
  const unselectedPct = st.students ? Math.round(st.unselected * 1000 / st.students) / 10 : 0;
  $('#dashboard').innerHTML = `
    <div class="dashboard-stat-grid">
      <article class="dashboard-stat-card dashboard-clickable" role="button" tabindex="0" title="点击查看访问明细" onclick="openDashboardDetail('visits')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openDashboardDetail('visits')}">
        <div class="dashboard-stat-head"><span>访问量</span><i title="登录页及各角色主页的真实页面访问次数">i</i></div>
        <strong>${formatCount(st.visits)}</strong>
        ${dashboardMiniBars(d.daily, 'visits', 'tone-blue')}
        <footer><span>今日访问</span><b>${formatCount(st.today_visits)}</b><em>${st.unique_ips} 个独立 IP</em></footer>
      </article>
      <article class="dashboard-stat-card dashboard-clickable" role="button" tabindex="0" title="点击查看已录学生名单" onclick="openDashboardDetail('matched')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openDashboardDetail('matched')}">
        <div class="dashboard-stat-head"><span>已录学生</span><i title="当前已经建立有效导师配对的学生人数">i</i></div>
        <strong>${formatCount(st.matched)}</strong>
        <div class="dashboard-stat-progress"><i style="width:${pairingPct}%"></i></div>
        <footer><span>配对完成率</span><b>${pairingPct}%</b><em>共 ${st.students} 名学生</em></footer>
      </article>
      <article class="dashboard-stat-card dashboard-clickable" role="button" tabindex="0" title="点击查看未选择学生名单" onclick="openDashboardDetail('unselected')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openDashboardDetail('unselected')}">
        <div class="dashboard-stat-head"><span>未选择学生</span><i title="尚未配对且当前没有待审核申请的学生">i</i></div>
        <strong class="tone-warning">${formatCount(st.unselected)}</strong>
        <div class="dashboard-stat-progress tone-orange"><i style="width:${unselectedPct}%"></i></div>
        <footer><span>未选择比例</span><b>${unselectedPct}%</b><em>未提交有效申请</em></footer>
      </article>

async function togglePhase() {
  const target = !info.open;
  const ok = await UI.confirm({
    title: target ? '开放学生申请' : '暂停学生新申请',
    message: target
      ? '开放后学生可以立即提交新的导师申请，确认开放吗？'
      : '暂停只会阻止学生提交新申请，导师仍可继续处理已有申请。确认暂停吗？',
    okText: target ? '确认开放' : '确认暂停'
  });
  if (!ok) { renderPhaseControl(info); return; }
  const sw = $('#phaseSwitch');
  sw.setAttribute('disabled', '');
  try {
    await UI.api('/api/admin/phase', { method: 'POST', body: JSON.stringify({ action: target ? 'open' : 'close' }) });
    UI.toast(target ? '已开放学生申请' : '已暂停学生新申请');
    loadOverview();
  } catch (e) { UI.toast(e.message, 'error'); sw.removeAttribute('disabled'); }
}

/* ---------- 基础选项设置 ---------- */
let optionSettings = null;

function optionRows(list, name, placeholder) {
  const items = (list || []).length ? list : [''];
  return items.map((value, index) => `<div class="option-row">
    <input type="text" name="${name}" value="${esc(value)}" placeholder="${esc(placeholder)}"
      oninput="markOptionDirty()" onkeydown="if(event.key==='Enter'){event.preventDefault();addOptionRow('${name}')}">
    <button class="btn btn-text btn-sm option-remove" type="button" title="删除该选项" aria-label="删除该选项" onclick="removeOptionRow(this)">✕</button>
  </div>`).join('');
}

function degreeRows(majors, degreeMap) {
  const list = (majors || []).filter(Boolean);
  if (!list.length) {
    return '<div class="option-empty">先添加专业，再为每个专业指定学硕或专硕。</div>';
  }
  return list.map(major => `<div class="option-degree-row">
    <span class="option-degree-name">${esc(major)}</span>
    <div class="visitor-segmented option-degree-segmented">
      <button type="button" data-major="${esc(major)}" class="${degreeMap[major] === '学硕' ? 'active' : ''}" onclick="setDegree(this.dataset.major,'学硕',this)">学硕</button>
      <button type="button" data-major="${esc(major)}" class="${degreeMap[major] === '专硕' ? 'active' : ''}" onclick="setDegree(this.dataset.major,'专硕',this)">专硕</button>
    </div>
    <button class="btn btn-text btn-sm" type="button" data-major="${esc(major)}" onclick="clearDegree(this.dataset.major)">不指定</button>
  </div>`).join('');
}

function optionPanelBody(o) {
  return `
    <div class="option-grid">
      <div class="option-block">
        <div class="option-block-head"><h4>学院</h4><span>导师所属学院与筛选顺序</span></div>
        <div class="option-list" id="optionColleges">${optionRows(o.colleges, 'colleges', '如：人工智能学院')}</div>
        <button class="btn btn-default btn-sm" type="button" onclick="addOptionRow('colleges')">＋ 添加学院</button>
      </div>
      <div class="option-block">
        <div class="option-block-head"><h4>招生类别</h4><span>导师可招收的学位类别</span></div>
        <div class="option-list" id="optionCategories">${optionRows(o.categories, 'categories', '如：学硕/专硕')}</div>
        <button class="btn btn-default btn-sm" type="button" onclick="addOptionRow('categories')">＋ 添加类别</button>
      </div>
      <div class="option-block">
        <div class="option-block-head"><h4>职称</h4><span>导师设置中的职称候选</span></div>
        <div class="option-list" id="optionTitles">${optionRows(o.titles, 'titles', '如：副教授')}</div>
        <button class="btn btn-default btn-sm" type="button" onclick="addOptionRow('titles')">＋ 添加职称</button>
      </div>
    </div>
    <div class="option-block option-block-wide">
      <div class="option-block-head"><h4>专业</h4><span>专业同时用于学生与导师的专业下拉，学硕/专硕归属决定招生名额规则</span></div>
      <div class="option-list option-list-grid" id="optionMajors">${optionRows(o.majors, 'majors', '如：计算机技术')}</div>
      <button class="btn btn-default btn-sm" type="button" onclick="addOptionRow('majors')">＋ 添加专业</button>
      <div class="option-degree-table">
        <div class="option-degree-head">学位类别归属</div>
        ${degreeRows(o.majors, o.degree_map || {})}
      </div>
    </div>
    <div class="option-note">保存后立即生效：学生端会看到新的专业表述，导师端与批量导入的下拉选项同步更新。已录入但被删除的选项仍会保留在下拉末尾，便于历史数据筛选。</div>`;
}

async function loadOptionSettings(force = false) {
  const box = $('#optionSettings');
  if (!box) return;
  if (optionSettings && !force) { box.innerHTML = optionPanelBody(optionSettings); return; }
  box.innerHTML = '<div class="option-loading">选项加载中…</div>';
  try {
    const d = await UI.api('/api/admin/options');
    optionSettings = d.options;
    box.innerHTML = optionPanelBody(optionSettings);
  } catch (e) {
    box.innerHTML = `<div class="option-loading">选项加载失败：${esc(e.message)}</div>`;
  }
}

function collectOptionValues(name) {
  return Array.from(document.querySelectorAll(`#optionSettings input[name="${name}"]`))
    .map(input => input.value.trim()).filter(Boolean)
    .filter((value, index, list) => list.indexOf(value) === index);
}

function addOptionRow(name) {
  const list = $(`#option${name.charAt(0).toUpperCase() + name.slice(1)}`);
  if (!list) return;
  list.insertAdjacentHTML('beforeend',
    `<div class="option-row"><input type="text" name="${name}" placeholder="" oninput="markOptionDirty()">
      <button class="btn btn-text btn-sm option-remove" type="button" onclick="removeOptionRow(this)">✕</button></div>`);
  list.lastElementChild.querySelector('input')?.focus();
  markOptionDirty();
}

function removeOptionRow(btn) {
  const row = btn.closest('.option-row');
  const name = row?.querySelector('input')?.name;
  row?.remove();
  if (name === 'majors') {
    const current = collectOptionValues('majors');
    Object.keys(optionSettings?.degree_map || {}).forEach(major => {
      if (!current.includes(major)) delete optionSettings.degree_map[major];
    });
    syncDegreeRows();
  }
  markOptionDirty();
}

function syncDegreeRows() {
  const holder = document.querySelector('.option-degree-table');
  if (!holder) return;
  const majors = collectOptionValues('majors');
  holder.innerHTML = `<div class="option-degree-head">学位类别归属</div>
    ${degreeRows(majors, optionSettings?.degree_map || {})}`;
}

function setDegree(major, degree, btn) {
  if (!optionSettings) optionSettings = {};
  optionSettings.degree_map = optionSettings.degree_map || {};
  optionSettings.degree_map[major] = degree;
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  markOptionDirty();
}

function clearDegree(major) {
  if (optionSettings?.degree_map) delete optionSettings.degree_map[major];
  syncDegreeRows();
  markOptionDirty();
}

function markOptionDirty() {

  save?.classList.add('option-unsaved');
}

async function saveOptionSettings(btn) {
  const body = {
    colleges: collectOptionValues('colleges'),
    categories: collectOptionValues('categories'),
    titles: collectOptionValues('titles'),
    majors: collectOptionValues('majors'),
    degree_map: optionSettings?.degree_map || {}
  };
  if (!body.majors.length) return UI.toast('至少需要保留一个专业', 'error');
  if (!body.colleges.length) return UI.toast('至少需要保留一个学院', 'error');
  try {
    const r = await UI.withBusy(btn, () => UI.api('/api/admin/options', { method: 'POST', body: JSON.stringify(body) }));
    optionSettings = r.options;
    $('#optionSettings').innerHTML = optionPanelBody(optionSettings);
    btn.classList.remove('option-unsaved');
    UI.toast('基础选项已保存，学生端与导师端下拉选项已更新');
  } catch (e) { UI.toast(e.message, 'error'); }
}

/* 下拉选项统一来自“互选控制 → 基础选项设置”。
   ensureCurrent 会把记录里已有的旧取值补进列表，避免编辑时被静默改掉。 */
function ensureCurrent(list, current) {
  const items = (list || []).slice();
  if (current && !items.includes(current)) items.push(current);
  return items;
}

function degreeTagOf(major) {
  const degree = optionSettings?.degree_map?.[major] || '';

}

async function loadInfoStatus() {
  try {
    const st = await UI.api('/api/admin/mentor_info/status');
    const kb = (st.size / 1024).toFixed(1);
    $('#infoStatus').innerHTML = st.exists
      ? `当前已上传：<b>${esc(st.filename)}</b>（${kb} KB，${esc(st.updated_at)}）— 学生端下载的就是这份文件`
      : '当前：<b>未上传</b> — 学生端下载空白占位表（可先点「下载测试」验证下载链路）';
  } catch (e) { $('#infoStatus').textContent = '状态加载失败'; }
}

async function uploadInfo(btn) {
  const f = document.getElementById('infoFile').files[0];
  if (!f) return UI.toast('请先选择文件', 'error');
  if (!/\.(xlsx|xls|csv)$/i.test(f.name)) return UI.toast('仅支持 .xlsx / .xls / .csv 格式', 'error');
  try {
    const fd = new FormData();
    fd.append('file', f);
    await UI.withBusy(btn, async () => {
      const r = await fetch('/api/admin/mentor_info', { method: 'POST', headers: { 'X-CSRF-Token': UI.csrf }, body: fd });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || '上传失败');
    });
    UI.toast('导师信息表已上传，学生端可下载');
    loadInfoStatus();
  } catch (e) { UI.toast(e.message, 'error'); }
}

async function delInfo() {
  const ok = await UI.confirm({
    title: '删除导师信息表',
    message: '确定删除已上传的导师信息表？学生端将恢复为空白占位表。',
    okText: '确认删除', danger: true
  });
  if (!ok) return;
  try { await UI.api('/api/admin/mentor_info/delete', { method: 'POST', body: '{}' }); UI.toast('已删除'); loadInfoStatus(); }
  catch (e) { UI.toast(e.message, 'error'); }
}

function studentSummaryCard(key, label, value, desc, tone = '') {
  const action = key === 'inactive'
    ? "setStudentQuickFilter('all','inactive')"
    : `setStudentQuickFilter('${key}','all')`;
  const toneClass = tone ? `tone-${tone}` : '';
  return `<button class="match-summary-card student-summary-card" type="button" onclick="${action}">
    <span>${label}</span>
    <strong class="${toneClass}">${value}</strong>
    <small>${desc}</small>
  </button>`;
}
function studentFilterSummary() {
  const parts = [];
  const statusLabels = { matched: '已配对', pending: '待导师审核', unselected: '尚未申请' };
  if (studentView.q) parts.push(`关键词“${studentView.q}”`);
  if (studentView.major) parts.push(studentView.major);
  if (studentView.status !== 'all') parts.push(statusLabels[studentView.status]);
  if (studentView.account === 'active') parts.push('账号启用');
  if (studentView.account === 'inactive') parts.push('账号停用');
  return parts.length ? `筛选：${parts.join(' · ')}` : '当前显示全部学生';
}

function renderStudentSelection(s) {
  if (s.match) {
    return `<div class="student-selection-state is-matched">
      <span class="student-state-badge">已配对</span>

  const pref = (s.round_info || [])[0];

    return `<div class="student-selection-state is-pending">

  }
  return `<div class="student-selection-state is-unselected">
    <span class="student-state-badge">尚未申请</span>
    <div class="student-selection-main"><b>暂无有效申请</b><span>学生尚未提交或已撤回申请</span></div>

function changeStudentPageSize() {

function renderPager(kind, p) {
  if (p.total_pages <= 1) return '';
  const fn = kind === 'student' ? 'loadStudents' : 'loadLogs';
  return `<div class="pager"><span class="pager-total">共 ${p.total} 条</span>
    <button class="btn btn-default btn-sm" type="button" onclick="${fn}(${p.page - 1})" ${p.page <= 1 ? 'disabled' : ''}>上一页</button>
    <span class="pager-now">${p.page} / ${p.total_pages}</span>
    <button class="btn btn-default btn-sm" type="button" onclick="${fn}(${p.page + 1})" ${p.page >= p.total_pages ? 'disabled' : ''}>下一页</button></div>`;
}

      <div class="form-item"><label>专业</label><select id="s_major"><option value="">请选择专业</option>${majors.map(v => `<option value="${esc(v)}" ${v === (s.major || '') ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></div>
      <div class="form-item"><label>手机号</label><input type="text" id="s_phone" value="${esc(s.phone || '')}"></div>
      <div class="form-item"><label>备注</label><input type="text" id="s_remark" value="${esc(s.remark || '')}"></div>
      ${id ? '' : '<div class="form-item"><label>初始密码（建议按名单设置；留空则与学号相同）</label><input type="text" id="s_pwd"></div>'}

      ${accountAction}

async function saveStudent(btn, id) {
  try {
    const body = { id, username: $('#s_user').value.trim(), name: $('#s_name').value.trim(),
      major: $('#s_major').value.trim(), phone: $('#s_phone').value.trim(), remark: $('#s_remark').value.trim(),
      password: $('#s_pwd')?.value.trim() || '' };
    if (!body.name) return UI.toast('姓名必填', 'error');
    await UI.withBusy(btn, () => UI.api('/api/admin/student', { method: 'POST', body: JSON.stringify(body) }));
    UI.toast('保存成功'); UI.closeModal(); loadStudents(); loadOverview();
  } catch (e) { UI.toast(e.message, 'error'); }
}

async function toggleStudent(id) {
  const s = (window._students || []).find(x => x.id === id);
  const active = s && s.active;
  if (active) {
    const ok = await UI.confirm({
      title: '停用学生账号',
      message: `确认停用学生「${s.name}」？停用后学生无法登录，且不能再提交或处理申请。`,
      okText: '确认停用', danger: true
    });
    if (!ok) return;
  }
  try {
    await UI.api('/api/admin/student/toggle', { method: 'POST', body: JSON.stringify({ id }) });
    UI.toast(active ? '学生账号已停用' : '学生账号已启用');
    UI.closeModal();
    loadStudents();
  }
  catch (e) { UI.toast(e.message, 'error'); }
}

/* ---------- 批量操作（复选框） ---------- */
const selMentor = new Set(), selStudent = new Set();
const SEL = { mentor: selMentor, student: selStudent };
const BAR = { mentor: 'mBatchBar', student: 'sBatchBar' };
const CNT = { mentor: 'mSelCount', student: 'sSelCount' };

function updateSel(kind) {
  const set = SEL[kind];
  set.clear();
  document.querySelectorAll(`.row-cb[data-kind="${kind}"]:checked`).forEach(c => set.add(+c.dataset.id));
  const bar = document.getElementById(BAR[kind]);
  if (bar) {
    bar.style.display = set.size ? 'flex' : 'none';
    document.getElementById(CNT[kind]).textContent = `已选 ${set.size} 项`;
    const all = document.getElementById(kind === 'mentor' ? 'mAll' : 'sAll');
    if (all) all.checked = document.querySelectorAll(`.row-cb[data-kind="${kind}"]`).length === set.size;
  }
}

function toggleAll(kind, cb) {
  document.querySelectorAll(`.row-cb[data-kind="${kind}"]`).forEach(c => c.checked = cb.checked);
  updateSel(kind);
}

function clearSel(kind) {
  document.querySelectorAll(`.row-cb[data-kind="${kind}"]`).forEach(c => c.checked = false);
  updateSel(kind);
}

function getSelIds(kind) { return [...SEL[kind]]; }

function batchResetPwd(kind) {
  const n = getSelIds(kind).length;
  UI.openModal(`<div class="modal-head"><h3>批量重置密码</h3><button class="modal-close" type="button" onclick="UI.closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="tip-block" style="margin-bottom:12px">将为选中的 <b>${n}</b> 个${kind === 'student' ? '学生' : '导师'}设置同一新密码</div>
      <div class="form-item"><label>新密码（至少6位）</label><input type="text" id="brpwd"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-default" type="button" onclick="UI.closeModal()">取消</button>
      <button class="btn btn-primary" type="button" onclick="doBatchResetPwd(this, '${kind}')">确认重置</button>
    </div>`);
}

async function doBatchResetPwd(btn, kind) {
  const pwd = $('#brpwd').value.trim();
  if (pwd.length < 6) return UI.toast('新密码至少6位', 'error');
  try {
    const r = await UI.withBusy(btn, () => UI.api('/api/admin/reset_password_batch', { method: 'POST', body: JSON.stringify({ kind, ids: getSelIds(kind), password: pwd }) }));
    UI.toast(`已重置 ${r.count} 个账号密码`);
    UI.closeModal(); clearSel(kind);
  } catch (e) { UI.toast(e.message, 'error'); }
}

function batchEdit(kind) {
  const n = getSelIds(kind).length;
  const fields = kind === 'mentor'
    ? `<option value="quota">招生名额</option>`
    : `<option value="major">专业</option>`;
  UI.openModal(`<div class="modal-head"><h3>批量编辑</h3><button class="modal-close" type="button" onclick="UI.closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="tip-block" style="margin-bottom:12px">为选中的 <b>${n}</b> 个${kind === 'student' ? '学生' : '导师'}统一设置</div>
      <div class="form-item"><label>字段</label><select id="bef">${fields}</select></div>
      <div class="form-item"><label>值</label>${kind === 'student'
        ? `<select id="bev"><option value="">请选择专业</option>${ensureCurrent(optionSettings?.majors, null).map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select>`
        : '<input type="number" id="bev" min="1" placeholder="如：5">'}</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-default" type="button" onclick="UI.closeModal()">取消</button>
      <button class="btn btn-primary" type="button" onclick="doBatchEdit(this, '${kind}')">确认修改</button>
    </div>`);
}

async function doBatchEdit(btn, kind) {
  const field = $('#bef').value;
  let value = $('#bev').value.trim();
  if (field === 'accept_adjust') value = (value === '接受' || value === '1') ? 1 : 0;
  if (kind === 'student' && field === 'major' && !value) return UI.toast('请选择专业', 'error');
  if (kind === 'mentor' && field === 'quota' && !(parseInt(value) >= 1)) return UI.toast('招生名额至少为 1', 'error');
  try {
    const r = await UI.withBusy(btn, () => UI.api('/api/admin/batch_edit', { method: 'POST', body: JSON.stringify({ kind, ids: getSelIds(kind), field, value }) }));
    UI.toast(`已修改 ${r.count} 项`);
    UI.closeModal(); clearSel(kind);
    loadMentors(); loadStudents(); loadOverview();
  } catch (e) { UI.toast(e.message, 'error'); }
}

async function batchDelete(kind) {
  const n = getSelIds(kind).length;
  const msg = kind === 'student'
    ? `确定删除选中的 ${n} 个学生？\n将连带删除其全部志愿与匹配记录！`
    : `确定删除选中的 ${n} 个导师？\n（存在志愿/匹配记录的导师会自动跳过）`;
  const ok = await UI.confirm({ title: '批量删除', message: msg, okText: '确认删除', danger: true });
  if (!ok) return;
  try {
    const url = kind === 'student' ? '/api/admin/student/delete_batch' : '/api/admin/mentor/delete_batch';
    const r = await UI.api(url, { method: 'POST', body: JSON.stringify({ ids: getSelIds(kind) }) });
    if (r.skipped && r.skipped.length) UI.toast(`删除 ${r.deleted} 个，跳过 ${r.skipped.length} 个：${r.skipped.join('；')}`, 'error');
    else UI.toast(`已删除 ${r.deleted} 个`);
    clearSel(kind);
    loadMentors(); loadStudents(); loadOverview();
  } catch (e) { UI.toast(e.message, 'error'); }
}

/* ---------- 匹配管理 ---------- */
let matchView = 'mentor';
const matchState = { q: '', college: '', quotaStatus: '', xueshuStatus: '', pendingStatus: '',
  studentStatus: '', degree: '', major: '', page: 1, pageSize: 20 };
let matchMentors = [];

function matchApiUrl(page = matchState.page) {
  return '/api/admin/matches?' + new URLSearchParams({
    view: matchView, q: matchState.q, page, page_size: matchState.pageSize,
    college: matchState.college, quota_status: matchState.quotaStatus,
    xueshu_status: matchState.xueshuStatus, pending_status: matchState.pendingStatus,
    student_status: matchState.studentStatus, degree: matchState.degree, major: matchState.major
  });
}

async function loadMatches(page = matchState.page) {
  matchState.page = Math.max(1, page || 1);
  const d = await UI.api(matchApiUrl());
  info = d.info;
  matchMentors = d.mentors || [];
  matchState.page = d.pagination.page;
  $('#matches').innerHTML = `${matchSummaryCards(d.summary)}
    <div class="card table-card match-management-card">
      <div class="card-head match-card-head">
        <div>
          <div class="ch-title">${matchView === 'mentor' ? '导师配对概览' : '学生配对明细'}</div>

            ? '按导师查看总名额、学硕上限、待审核申请与已录学生'

        </div>
        <div class="match-view-switch" role="group" aria-label="匹配管理视角">
          <button class="${matchView === 'mentor' ? 'active' : ''}" type="button" onclick="setMatchView('mentor')">导师视角</button>
          <button class="${matchView === 'student' ? 'active' : ''}" type="button" onclick="setMatchView('student')">学生视角</button>
        </div>
      </div>
      ${matchToolbar(d)}

}

function matchSummaryCards(s) {

function matchMentorTable(d) {

    <tbody>${d.mentor_rows.map(m => {
      const quotaPct = Math.min(100, Math.round((m.taken / Math.max(1, m.quota)) * 100));
      const xueshuClass = m.xueshu_matched > 3 ? 'tag-red' : m.xueshu_matched === 3 ? 'tag-orange' : 'tag-blue';
      const statuses = [];
      if (!m.active) statuses.push('<span class="tag tag-gray">账号停用</span>');
      if (m.xueshu_matched > 3) statuses.push('<span class="tag tag-red">学硕历史超额</span>');
      else if (m.xueshu_matched === 3) statuses.push('<span class="tag tag-orange">学硕已满</span>');
      if (m.remaining <= 0) statuses.push('<span class="tag tag-gray">总名额已满</span>');
      if (!statuses.length) statuses.push('<span class="tag tag-green">可继续录取</span>');

function mentorOpts(mentors, selected = null, degreeCategory = '') {
  return '<option value="">请选择导师</option>' + mentors.map(m => {
    const xueshuBlocked = info.xueshu_limit_enabled && degreeCategory === '学硕' && m.xueshu_remaining <= 0 && m.id !== selected;
    const quotaBlocked = m.remaining <= 0 && m.id !== selected;
    const disabled = xueshuBlocked || quotaBlocked;
    const suffix = xueshuBlocked ? '学硕已满' : quotaBlocked ? '总名额已满' : `余 ${m.remaining}`;
    return `<option value="${m.id}" ${m.id === selected ? 'selected' : ''} ${disabled ? 'disabled' : ''}>${esc(m.name)}（${suffix}）</option>`;
  }).join('');
}

function applyMatchFilters() {
  matchState.q = ($('#matchSearch')?.value || '').trim();

    matchState.college = $('#matchCollege')?.value || '';
    matchState.quotaStatus = $('#matchQuotaStatus')?.value || '';
    matchState.xueshuStatus = $('#matchXueshuStatus')?.value || '';
    matchState.pendingStatus = $('#matchPendingStatus')?.value || '';
  } else {
    matchState.studentStatus = $('#matchStudentStatus')?.value || '';
    matchState.degree = $('#matchDegree')?.value || '';

  }

}

function resetMatchFilters() {
  Object.assign(matchState, { q: '', college: '', quotaStatus: '', xueshuStatus: '', pendingStatus: '',
    studentStatus: '', degree: '', major: '', page: 1 });
  loadMatches(1);
}

function changeMatchPageSize() {
  matchState.pageSize = parseInt($('#matchPageSize').value, 10) || 20;
  loadMatches(1);
}

function applyMatchSummary(type) {
  resetMatchFiltersState();
  if (type === 'paired' || type === 'unmatched') {
    matchView = 'student';
    matchState.studentStatus = type === 'paired' ? 'matched' : 'unmatched';
  } else {
    matchView = 'mentor';
    if (type === 'pending') matchState.pendingStatus = 'has_pending';
    if (type === 'full') matchState.quotaStatus = 'full';
    if (type === 'xueshu') matchState.xueshuStatus = 'at_limit';
  }
  loadMatches(1);
}

function resetMatchFiltersState() {
  Object.assign(matchState, { q: '', college: '', quotaStatus: '', xueshuStatus: '', pendingStatus: '',
    studentStatus: '', degree: '', major: '', page: 1 });
}

async function setMatch(btn, student_id, selId) {
  try {
    const mentor_id = selId ? parseInt($('#' + selId).value) : null;
    if (!mentor_id && selId) return UI.toast('请选择导师', 'error');
    if (!selId) {
      const ok = await UI.confirm({
        title: '解除配对',
        message: '确认解除该学生当前配对？学生将恢复为可选择状态，名额同时释放。',
        okText: '确认解除', danger: true
      });
      if (!ok) return;
    } else {
      const ok = await UI.confirm({
        title: '调整配对',
        message: '确认将该学生调整到所选导师？原配对将被解除，新配对立即生效。',
        okText: '确认调整'
      });
      if (!ok) return;
    }
    await UI.withBusy(btn, () => UI.api('/api/admin/match', { method: 'POST', body: JSON.stringify({ student_id, mentor_id }) }));
    UI.toast(mentor_id ? '已调整匹配' : '已清空匹配');
    UI.closeDrawer();
    loadMatches(); loadOverview();
  } catch (e) { UI.toast(e.message, 'error'); }
}

const logView = { q: '', action: '', status: '', page: 1 };
let logSearchWasFocused = false;

function formatLogDetail(raw) {
  try {
    const d = JSON.parse(raw || '{}');
    const labels = { action_name: '流程', kind: '类型', id: '记录ID', ids: '记录ID', name: '姓名',
      username: '账号', student_id: '学生ID', mentor_id: '导师ID', round: '轮次', field: '字段',
      value: '值', filename: '文件', result_count: '处理数', result_added: '新增', result_updated: '更新',
      result_deleted: '删除', error: '错误' };
    return Object.entries(d).filter(([k]) => k !== 'action' && k !== 'confirm_reopen')
      .map(([k, v]) => `<span class="log-detail-item"><b>${esc(labels[k] || k)}：</b>${esc(Array.isArray(v) ? v.join(', ') : v)}</span>`).join('') || '<span class="empty-inline">无附加信息</span>';
  } catch (_) { return esc(raw || ''); }
}

async function loadLogs(page = logView.page) {
  logView.page = page;
  const qs = new URLSearchParams({ q: logView.q, action: logView.action, status: logView.status,
    page: logView.page, page_size: 20 });
  const d = await UI.api('/api/admin/audit_logs?' + qs.toString());
  logView.page = d.pagination.page;
  $('#logs').innerHTML = `
    <div class="card table-card">
      <div class="card-head">
        <div>
          <div class="ch-title">管理员操作日志</div>
          <div class="ch-desc">共 ${d.pagination.total} 条 · 自动记录流程和数据修改，密码内容不会入库</div>
        </div>
      </div>
      <div class="filter-bar">
        <div class="search-box"><input type="text" id="logSearch" value="${esc(logView.q)}" placeholder="搜索操作人、详情或 IP"></div>
        <select id="logAction" onchange="applyLogFilters()"><option value="">全部操作</option>${d.actions.map(a => `<option value="${esc(a)}" ${a === logView.action ? 'selected' : ''}>${esc(a)}</option>`).join('')}</select>
        <select id="logStatus" onchange="applyLogFilters()"><option value="">全部结果</option><option value="success" ${logView.status === 'success' ? 'selected' : ''}>成功</option><option value="failed" ${logView.status === 'failed' ? 'selected' : ''}>失败</option></select>
        <button class="btn btn-default" type="button" onclick="resetLogFilters()">清除筛选</button>
      </div>
      <div class="table-wrap has-hint audit-table-wrap"><table>
        <thead><tr><th>时间</th><th>操作人</th><th>操作</th><th>结果</th><th>详情</th><th>来源 IP</th></tr></thead>
        <tbody>${d.logs.map(l => `<tr>
          <td class="log-time">${esc(l.created_at)}</td>
          <td><span class="cell-main">${esc(l.operator_name)}</span><div class="cell-sub">${esc(l.username)}</div></td>
          <td><span class="tag tag-blue">${esc(l.action)}</span></td>
          <td>${l.status === 'success' ? '<span class="tag tag-green">成功</span>' : '<span class="tag tag-red">失败</span>'}</td>
          <td><div class="log-detail">${formatLogDetail(l.detail)}</div></td>
          <td class="log-ip">${esc(l.ip)}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">暂无操作日志</td></tr>'}
        </tbody></table></div>
      ${renderPager('logs', d.pagination)}
    </div>`;
  UI.bindSearch($('#logSearch'), { debounceMs: 350, onApply: applyLogFilters, onEnter: applyLogFilters });
  if (logSearchWasFocused) {
    const ls = $('#logSearch');
    ls?.focus();
    ls?.setSelectionRange(ls.value.length, ls.value.length);
    logSearchWasFocused = false;
  }
}

function applyLogFilters() {
  logSearchWasFocused = document.activeElement && document.activeElement.id === 'logSearch';
  logView.q = $('#logSearch')?.value.trim() || '';
  logView.action = $('#logAction')?.value || '';
  logView.status = $('#logStatus')?.value || '';
  loadLogs(1);
}

function resetLogFilters() {
  logView.q = ''; logView.action = ''; logView.status = ''; loadLogs(1);
}
